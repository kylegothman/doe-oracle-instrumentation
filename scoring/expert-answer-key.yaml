  - number: 2
    category: "Core concept"
    question: "What makes combinatorial testing cost effective?"
    expert_answer: |-
      Combinatorial Testing (CT) is based on combinatorics, a branch of mathematics that studies different ways of selecting and combining things. In software testing, CT uses this mathematical approach to select a smaller number of test cases instead of testing every possible combination of input values. The selected test cases are designed to cover all possible interactions among a given number of input parameters, such as pairs or groups of three. In this way, CT can greatly reduce the number of test cases while still providing systematic coverage of interactions among input parameters.
    key_points:
      - "Combinatorial testing is based on combinatorics, the mathematics of selecting and combining things."
      - "It selects a smaller number of test cases instead of testing every possible combination of input values."
      - "The selected test cases cover all possible interactions among a given number of input parameters, such as pairs or groups of three."
      - "It greatly reduces the number of test cases while still giving systematic coverage of interactions."
