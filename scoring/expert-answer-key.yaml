  - number: 4
    category: "Core concept"
    question: "What is the difference between exhaustive testing and combinatorial testing?"
    expert_answer: |-
      Exhaustive testing tests every possible combination of input values, while combinatorial testing uses fewer test cases by focusing on combinations of a small number of input parameters. For example, pairwise testing checks every possible combination of values for any two parameters, rather than testing all possible combinations of all parameters. In this way, combinatorial testing can greatly reduce the number of test cases while still detecting many failures caused by interactions among input parameters.
    key_points:
      - "Exhaustive testing tests every possible combination of input values."
      - "Combinatorial testing uses fewer test cases by focusing on combinations of a small number of input parameters."
      - "Pairwise testing, for example, checks every combination of values for any two parameters, not all combinations of all parameters."
      - "Combinatorial testing greatly reduces the number of test cases while still detecting many failures caused by interactions among input parameters."
