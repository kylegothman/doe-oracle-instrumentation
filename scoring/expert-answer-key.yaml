  - number: 8
    category: "Tied to one paper"
    question: "How does combinatorial testing relate to MC/DC coverage?"
    expert_answer: |-
      CT and MC/DC both help test how different conditions affect a software system, but they work in different ways. CT tests combinations of input values to find failures that occur when certain values are used together. MC/DC checks whether changing one condition, while keeping the others the same, can change the result of a decision made by the software. Although CT can help create test cases for MC/DC, it does not guarantee that MC/DC requirements will be satisfied. Using both methods together can help find more software problems.
    key_points:
      - "Combinatorial testing and MC/DC both test how different conditions affect a system, but in different ways."
      - "Combinatorial testing tests combinations of input values to find failures that occur when certain values are used together."
      - "MC/DC checks whether changing one condition, while the others stay the same, can change the result of a decision."
      - "Combinatorial testing can help create test cases for MC/DC."
      - "Combinatorial testing does not guarantee that MC/DC requirements will be satisfied."
      - "Using both methods together can find more problems."
