  - number: 1
    category: "Core concept"
    question: "What is combinatorial testing?"
    expert_answer: |-
      Many software failures result from interactions among a small number of factors rather than from individual factors alone. Combinatorial Testing (CT) is a technique to address this problem.

      Rather than testing every possible combination, CT uses a smaller set of test cases to cover interactions among factors. For example, pairwise (2-way) testing covers all possible combinations of values for every pair of factors, while 3-way testing covers all possible combinations involving any three factors. More generally, t-way testing covers all possible combinations of values for every group of t factors.
    key_points:
      - "Many software failures come from interactions among a small number of factors, not from single factors alone."
      - "Combinatorial testing covers interactions among factors with a smaller set of test cases than testing every possible combination."
      - "Pairwise (2-way) testing covers all combinations of values for every pair of factors."
      - "t-way testing covers all combinations of values for every group of t factors."
