  - number: 11
    category: "Outside the Oracle's papers"
    question: "What is mutation testing?"
    expert_answer: |-
      Mutation testing is a technique used to check how well a set of test cases can detect software faults. It works by making small syntactic changes to a program to introduce artificial faults. These modified programs are called mutants. The test cases are then run to see whether they can detect the changes. If a test case detects a change, the corresponding mutant is considered "killed." In general, the more mutants a set of test cases can kill, the more effective it is considered to be.
    key_points:
      - "Mutation testing checks how well a set of test cases can detect software faults."
      - "It makes small syntactic changes to a program to introduce artificial faults."
      - "The modified programs are called mutants."
      - "The test cases are run to see whether they detect the changes, and a detected mutant is \"killed\"."
      - "The more mutants a set of test cases kills, the more effective it is considered to be."
